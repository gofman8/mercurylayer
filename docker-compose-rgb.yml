# RGB overlay for the Mercury Layer regtest stack.
#
# Use together with docker-compose-test.yml, which already provides bitcoind (regtest), electrs
# (electrum on :50001), postgres, the SGX enclave (SIM) and the Mercury server. This overlay adds
# the RGB proxy server used by rgb-lib for consignment exchange / endpoint validation.
#
#   docker compose -f docker-compose-test.yml -f docker-compose-rgb.yml up --build
#
# The RGB integration in this repo relays consignments *in-band* (inside the Mercury transfer
# message), so the proxy is only strictly required for transport-endpoint validation done by
# rgb-lib when going online / receiving. It is kept here so the stack matches a production-like RGB
# deployment and so the proxy path keeps working.
services:
  rgb-proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    container_name: mercurylayer-rgb-proxy-1
    ports:
      - "3000:3000"
    restart: unless-stopped
