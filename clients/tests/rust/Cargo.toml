[package]
name = "rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
mercuryrustlib = { path = "../../libs/rust" }
mercurylib = { path = "../../../lib" }
mercury-rgb = { path = "../../libs/rust-rgb" }
mercury-utexo-sdk = { path = "../../libs/rust-sdk" }
tokio = { version = "1.27.0", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
electrum-client = "0.18.0"
uuid = { version = "1.3.1", features = ["v4", "serde"] }
sha2 = "0.10.8"
reqwest = { version = "0.11.16", features = ["json"] }
env_logger = "0.10"
hex = "0.4.3"
rand = "0.8"
# sdk92 builds a REAL transaction and the session that transaction actually produces, so the only
# difference it feeds the SE is one satoshi of prevout value. Same versions as `lib/Cargo.toml`, so
# the test and the client agree on sighash and session construction rather than approximating them.
bitcoin = { version = "0.30.1", features = ["serde", "base64", "rand-std", "std"], default-features = false }
secp256k1-zkp = { git = "https://github.com/ssantos21/rust-secp256k1-zkp.git", branch = "blinded-musig-scheme", features = [ "rand-std", "bitcoin_hashes", "std" ] }
