[package]
name = "mercury-utexo-sdk"
version = "0.1.0"
edition = "2021"
description = "Spark-parity wallet SDK for Mercury Layer statechains with RGB assets: frictionless deposits, off-chain transfers, exact-amount payments (off-chain split/combine), tokens, and exits."

[lib]
name = "mercury_utexo_sdk"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.11.16", features = ["json"] }
sha2 = "0.10.8"
bitcoin = { version = "0.30.1", features = ["serde", "base64", "rand-std", "std", "bitcoinconsensus"], default-features = false }
electrum-client = "0.18.0"
hex = "0.4.3"
secp256k1-zkp = { git = "https://github.com/ssantos21/rust-secp256k1-zkp.git", branch = "blinded-musig-scheme", features = [ "rand-std", "bitcoin_hashes", "std" ] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
sqlx = { version = "0.8.1", features = [ "runtime-tokio", "sqlite", "time", "uuid" ] }
tokio = { version = "1.27.0", features = ["full"] }
uuid = { version = "1.3.1", features = ["v4", "serde"] }
mercurylib = { path = "../../../lib" }
mercuryrustlib = { path = "../rust" }
mercury-rgb = { path = "../rust-rgb" }
