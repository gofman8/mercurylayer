[package]
name = "mercury-ssp"
version = "0.1.0"
edition = "2021"
description = "SSP (Spark Service Provider parity) HTTP service: Mercury<->Lightning swaps over an rgb-lightning-node."

[[bin]]
name = "mercury-ssp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
rocket = { version = "0.5.0", features = ["json"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.27.0", features = ["full"] }
mercury-utexo-sdk = { path = "../../libs/rust-sdk" }
